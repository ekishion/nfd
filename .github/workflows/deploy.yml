name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Test Suite & Build
        run: |
          npm test
          node build.js

      - name: Generate Dynamic Wrangler Config
        run: |
          node -e '
          const fs = require("fs");
          if (fs.existsSync("wrangler.jsonc")) {
            fs.unlinkSync("wrangler.jsonc");
          }
          const config = {
            name: "nfd",
            main: "worker.js",
            compatibility_date: "2024-09-01",
            vars: {}
          };
          // 仅收集非敏感的普通配置参数，敏感密钥严格由用户在 Cloudflare 控制台直接配置
          const excludedKeys = new Set(["ENV_BOT_TOKEN", "ENV_BOT_SECRET", "CF_API_TOKEN", "CF_ACCOUNT_ID", "KV_NAMESPACE_ID"]);
          for (const [k, v] of Object.entries(process.env)) {
            if (k.startsWith("ENV_") && !excludedKeys.has(k) && v && v.trim()) {
              config.vars[k] = v.trim();
            }
          }
          if (process.env.KV_NAMESPACE_ID && process.env.KV_NAMESPACE_ID.trim()) {
            config.kv_namespaces = [
              {
                binding: "nfd",
                id: process.env.KV_NAMESPACE_ID.trim()
              }
            ];
          }
          fs.writeFileSync("wrangler.json", JSON.stringify(config, null, 2));
          '
        env:
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
          ENV_ADMIN_UID: ${{ secrets.ENV_ADMIN_UID || vars.ENV_ADMIN_UID }}
          ENV_FORWARD_CHAT_ID: ${{ secrets.ENV_FORWARD_CHAT_ID || vars.ENV_FORWARD_CHAT_ID }}
          ENV_FORWARD_THREAD_ID: ${{ secrets.ENV_FORWARD_THREAD_ID || vars.ENV_FORWARD_THREAD_ID }}
          ENV_FORWARD_DELAY_SECONDS: ${{ secrets.ENV_FORWARD_DELAY_SECONDS || vars.ENV_FORWARD_DELAY_SECONDS }}
          ENV_ALERT_CHAT_ID: ${{ secrets.ENV_ALERT_CHAT_ID || vars.ENV_ALERT_CHAT_ID }}
          ENV_ALERT_THREAD_ID: ${{ secrets.ENV_ALERT_THREAD_ID || vars.ENV_ALERT_THREAD_ID }}
          ENV_ENABLE_FORUM_TOPICS: ${{ secrets.ENV_ENABLE_FORUM_TOPICS || vars.ENV_ENABLE_FORUM_TOPICS }}
          ENV_REQUIRE_USERNAME: ${{ secrets.ENV_REQUIRE_USERNAME || vars.ENV_REQUIRE_USERNAME }}
          ENV_REQUIRE_PHOTO: ${{ secrets.ENV_REQUIRE_PHOTO || vars.ENV_REQUIRE_PHOTO }}
          ENV_AUTO_BLOCK_KEYWORD_VIOLATORS: ${{ secrets.ENV_AUTO_BLOCK_KEYWORD_VIOLATORS || vars.ENV_AUTO_BLOCK_KEYWORD_VIOLATORS }}
          ENV_KEYWORD_VIOLATION_LIMIT: ${{ secrets.ENV_KEYWORD_VIOLATION_LIMIT || vars.ENV_KEYWORD_VIOLATION_LIMIT }}
          ENV_ENABLE_FLOOD_PROTECTION: ${{ secrets.ENV_ENABLE_FLOOD_PROTECTION || vars.ENV_ENABLE_FLOOD_PROTECTION }}
          ENV_BLOCK_EXECUTABLES: ${{ secrets.ENV_BLOCK_EXECUTABLES || vars.ENV_BLOCK_EXECUTABLES }}
          ENV_AWAY_MODE: ${{ secrets.ENV_AWAY_MODE || vars.ENV_AWAY_MODE }}
          ENV_AWAY_MESSAGE: ${{ secrets.ENV_AWAY_MESSAGE || vars.ENV_AWAY_MESSAGE }}
          ENV_FRAUD_DB_URL: ${{ secrets.ENV_FRAUD_DB_URL || vars.ENV_FRAUD_DB_URL }}
          ENV_KEYWORD_DB_URL: ${{ secrets.ENV_KEYWORD_DB_URL || vars.ENV_KEYWORD_DB_URL }}
          ENV_START_MESSAGE_URL: ${{ secrets.ENV_START_MESSAGE_URL || vars.ENV_START_MESSAGE_URL }}
          ENV_PUSHDEER_KEY: ${{ secrets.ENV_PUSHDEER_KEY || vars.ENV_PUSHDEER_KEY }}
          ENV_PUSHDEER_URL: ${{ secrets.ENV_PUSHDEER_URL || vars.ENV_PUSHDEER_URL }}
          ENV_SERVERCHAN_KEY: ${{ secrets.ENV_SERVERCHAN_KEY || vars.ENV_SERVERCHAN_KEY }}
          ENV_NOTIFY_CHANNELS_ON_ALERT_ONLY: ${{ secrets.ENV_NOTIFY_CHANNELS_ON_ALERT_ONLY || vars.ENV_NOTIFY_CHANNELS_ON_ALERT_ONLY }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          command: deploy worker.js --config wrangler.json
